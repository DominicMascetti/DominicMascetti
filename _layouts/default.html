<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% if page.title %}{{ page.title }} — Dominic{% else %}{{ site.title }}{% endif %}</title>
  <meta name="theme-color" content="#5c0000" />
{% if page.layout == "post" %}
  <meta property="og:type" content="article" />
  <meta property="og:title" content="{{ page.title | escape }}" />
  <meta property="og:description" content="{{ page.description | escape }}" />
  <meta property="og:url" content="{{ page.url | absolute_url }}" />
  <meta property="og:site_name" content="Dominic Mascetti" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="{{ page.title | escape }}" />
  <meta name="twitter:description" content="{{ page.description | escape }}" />
{% endif %}
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}" />
</head>
<body>
<div class="wrap">

  {% unless page.url == "/" or page.layout == "post" %}
  <a class="back" href="/">← home</a>
  {% endunless %}

  <main>
    {{ content }}
  </main>

</div>
</body>
</html>
