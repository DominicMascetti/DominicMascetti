title: Dominic Mascetti
url: "https://dominicmascetti.com"

# Clean URLs (blog/disappointment-day). Jekyll still writes the file as
# blog/disappointment-day.html, and GitHub Pages serves it both with and
# without the extension.
permalink: /blog/:slug

# Posts used to live at /posts/<slug>(.html). Each older post lists its old
# path under redirect_from so shared links still land on it.
plugins:
  - jekyll-redirect-from

markdown: kramdown

# Anything in _posts automatically gets layout: post — you don't need to add
# "layout: post" to your front matter, it's applied for you.
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

# Comments (see _includes/comments.html). The publishable key is safe to ship:
# row-level security limits it to reading approved comments and adding new ones.
supabase_url: https://lkhasrwsvrxahvynpawv.supabase.co
supabase_key: sb_publishable_7WQtyNK8NLIPXqiFrEyBjQ_o_oJvid8

# Supabase backend (migrations, edge function) and build tooling stay out of
# the published site.
exclude:
  - supabase
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
  - node_modules
  - vendor
  - "*.sql"
  - "**/*.sql"
