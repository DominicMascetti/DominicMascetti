title: Dominic Mascetti
url: "https://dominicmascetti.com"

# Clean URLs (posts/disappointment-day). Jekyll still writes the file as
# posts/disappointment-day.html, and GitHub Pages serves it both with and
# without the extension, so already-shared .html links keep working.
permalink: /posts/:slug

markdown: kramdown

# Anything in _posts automatically gets layout: post — you don't need to add
# "layout: post" to your front matter, it's applied for you.
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

# Comments (see _includes/comments.html). The publishable key is safe to ship:
# row-level security limits it to reading approved comments and adding new ones.
supabase_url: https://lkhasrwsvrxahvynpawv.supabase.co
supabase_key: sb_publishable_7WQtyNK8NLIPXqiFrEyBjQ_o_oJvid8

# Supabase backend (migrations, edge function) stays out of the published site.
exclude:
  - supabase
  - "*.sql"
  - "**/*.sql"
