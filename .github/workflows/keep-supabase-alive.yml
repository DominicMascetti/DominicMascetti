name: Keep Supabase Alive

on:
  schedule:
    # Runs once a day at 14:17 UTC (around 7am Pacific)
    - cron: "17 14 * * *"
  # Lets you run it manually from the Actions tab to test it
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one row from the comments table
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          # Quick sanity checks (prints lengths/prefix only, never the full key)
          echo "URL length: ${#SUPABASE_URL}"
          echo "Key length: ${#SUPABASE_PUBLISHABLE_KEY}"
          echo "Key starts with: ${SUPABASE_PUBLISHABLE_KEY:0:15}"

          status=$(curl --silent --show-error \
            -o response.txt -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/comments?select=*&limit=1" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY")

          echo "HTTP status: $status"
          echo "Response:"
          cat response.txt
          echo

          if [ "$status" -ge 400 ]; then
            exit 1
          fi
