name: Deploy Supabase functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/moderate-comment/**'
      - 'supabase/config.toml'
  # Lets you run it manually from the Actions tab
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # The database webhook authenticates with the x-webhook-secret header
      # instead of a JWT, so JWT verification stays off.
      - name: Deploy moderate-comment
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy moderate-comment --project-ref lkhasrwsvrxahvynpawv --no-verify-jwt
