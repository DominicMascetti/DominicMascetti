<section id="comments" class="comments" data-post="{{ page.url }}">
  <h2 class="comments-heading">comments</h2>
  <form class="comment-form" novalidate>
    <textarea name="body" required maxlength="3000" rows="1" placeholder="say something…" aria-label="Comment"></textarea>
    <!-- Name and button stay hidden until someone starts a comment. -->
    <div class="comment-extra">
      <input type="text" name="name" required maxlength="60" placeholder="name" autocomplete="name" aria-label="Name" />
      <!-- Honeypot: hidden from people, tempting to bots. -->
      <div class="comment-hp" aria-hidden="true">
        <label>Website <input type="text" name="website" tabindex="-1" autocomplete="off" /></label>
      </div>
      <div class="comment-actions">
        <button type="submit">post comment →</button>
        <span class="comment-msg" role="status"></span>
      </div>
    </div>
  </form>

  <ol class="comment-list" aria-live="polite"></ol>
  <p class="comments-status"></p>
</section>

<style>
  .comments { margin-bottom: 1.5rem; }
  .comments-heading {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 400;
    letter-spacing: 0.04em;
    color: var(--faint);
    margin-bottom: 0.75rem;
  }
  .comment-list { list-style: none; }
  .comment-list:not(:empty) { margin-top: 1.75rem; }
  .comment { margin-bottom: 1.25rem; }
  .comment:last-child { margin-bottom: 0; }
  .comment-meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--faint);
    margin-bottom: 0.15rem;
  }
  .comment-author { color: var(--accent); margin-right: 0.6rem; }
  .comment-body { white-space: pre-wrap; overflow-wrap: anywhere; }
  .comment-reply {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    background: none;
    border: none;
    color: var(--faint);
    cursor: pointer;
    padding: 0;
    margin-left: 0.6rem;
  }
  .comment-reply:hover { color: var(--accent); }
  .comment-replies {
    list-style: none;
    margin: 0.9rem 0 0 0.2rem;
    padding-left: 1rem;
    border-left: 1px solid var(--rule);
  }
  .comment-replies:empty { display: none; }
  .comment-replies .comment { margin-bottom: 0.9rem; }
  .comment .comment-form { margin-top: 0.6rem; }
  .comments-status {
    font-style: italic;
    color: var(--muted);
    font-size: 1rem;
    margin-top: 1rem;
  }
  .comments-status:empty { display: none; }
  .comment-form input,
  .comment-form textarea {
    display: block;
    width: 100%;
    font-family: 'EB Garamond', Georgia, serif;
    font-size: 0.95rem;
    line-height: 1.5;
    color: var(--ink);
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--rule);
    border-radius: 0;
    padding: 0.1rem 0;
    outline: none;
    resize: none;
    overflow: hidden;
  }
  .comment-form input:focus,
  .comment-form textarea:focus { border-bottom-color: var(--accent); }
  .comment-extra { display: none; }
  .comment-form.open .comment-extra { display: block; }
  .comment-form input { max-width: 16rem; margin-top: 0.8rem; }
  .comment-hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
  .comment-actions {
    display: flex;
    align-items: baseline;
    gap: 1rem;
    margin-top: 0.9rem;
  }
  .comment-msg {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--faint);
  }
  .comment-form button {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.04em;
    background: none;
    border: none;
    color: var(--accent);
    cursor: pointer;
    padding: 0;
    white-space: nowrap;
  }
  .comment-form button:hover { color: var(--accent-hover); }
  .comment-form button:disabled { color: var(--faint); cursor: default; }
</style>

<script>
(function () {
  var SUPABASE_URL = {{ site.supabase_url | jsonify }};
  var SUPABASE_KEY = {{ site.supabase_key | jsonify }};
  var RELOAD_DELAY_MS = 2500;
  var PENDING_MAX_AGE_MS = 30 * 24 * 60 * 60 * 1000;

  var section = document.getElementById('comments');
  var post = section.getAttribute('data-post');
  var list = section.querySelector('.comment-list');
  var status = section.querySelector('.comments-status');
  var mainForm = section.querySelector('.comment-form');
  var headers = { apikey: SUPABASE_KEY };
  var approved = [];

  // The visitor's own comments that aren't approved yet, kept in their browser
  // so they show up for them straight away (and only for them).
  var pendingKey = 'pending-comments:' + post;

  function readPending() {
    try { return JSON.parse(localStorage.getItem(pendingKey)) || []; } catch (e) { return []; }
  }

  function writePending(pending) {
    try {
      if (pending.length) localStorage.setItem(pendingKey, JSON.stringify(pending));
      else localStorage.removeItem(pendingKey);
    } catch (e) { /* storage unavailable; the comment just won't persist locally */ }
  }

  // Ask what happened to our pending comments and forget any that were
  // rejected or deleted. Only the holder of a token can ask about it.
  function checkPending() {
    var tokens = readPending().map(function (p) { return p.token; }).filter(Boolean);
    if (!tokens.length) return Promise.resolve();
    return fetch(SUPABASE_URL + '/rest/v1/rpc/comment_status', {
      method: 'POST',
      headers: Object.assign({ 'Content-Type': 'application/json' }, headers),
      body: JSON.stringify({ tokens: tokens })
    })
      .then(function (res) {
        if (!res.ok) throw new Error(res.status);
        return res.json();
      })
      .then(function (rows) {
        var removed = rows.filter(function (r) { return r.status === 'removed'; })
                          .map(function (r) { return r.token; });
        writePending(readPending().filter(function (p) { return removed.indexOf(p.token) === -1; }));
      })
      .catch(function () { /* keep showing them; try again next load */ });
  }

  // Drop pending comments that are now approved (or too old to be worth showing).
  function stillPending() {
    var cutoff = Date.now() - PENDING_MAX_AGE_MS;
    var pending = readPending().filter(function (p) {
      return new Date(p.created_at).getTime() > cutoff && !approved.some(function (c) {
        return c.name === p.name && c.body === p.body && c.parent_id == p.parent_id;
      });
    });
    writePending(pending);
    return pending;
  }

  function formatDate(iso) {
    var d = new Date(iso);
    function pad(n) { return String(n).padStart(2, '0'); }
    return pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + '-' + d.getFullYear();
  }

  function renderComment(c) {
    var li = document.createElement('li');
    li.className = 'comment';

    var meta = document.createElement('div');
    meta.className = 'comment-meta';
    var author = document.createElement('span');
    author.className = 'comment-author';
    author.textContent = c.name;
    var date = document.createElement('span');
    date.textContent = formatDate(c.created_at);
    meta.append(author, date);

    var body = document.createElement('p');
    body.className = 'comment-body';
    body.textContent = c.body;

    li.append(meta, body);
    return li;
  }

  // Replies are one level deep: replying to a reply joins the same thread.
  function addReplyButton(li, threadId) {
    var reply = document.createElement('button');
    reply.type = 'button';
    reply.className = 'comment-reply';
    reply.textContent = 'reply';
    reply.addEventListener('click', function () {
      var open = section.querySelector('.comment .comment-form');
      if (open) {
        var sameSpot = open.parentNode === li;
        open.remove();
        if (sameSpot) return;
      }
      var form = mainForm.cloneNode(true);
      form.reset();
      form.classList.remove('open');
      form.querySelector('.comment-msg').textContent = '';
      form.elements.body.placeholder = 'reply…';
      form.querySelector('button').textContent = 'post reply →';
      setupForm(form, threadId);
      li.append(form);
      form.elements.body.focus();
    });
    li.querySelector('.comment-meta').append(reply);
  }

  function render() {
    var comments = approved.concat(stillPending()).sort(function (a, b) {
      return new Date(a.created_at) - new Date(b.created_at);
    });
    var threads = {};
    list.replaceChildren();
    comments.forEach(function (c) {
      if (c.parent_id) return;
      var li = renderComment(c);
      if (c.id) {
        var replies = document.createElement('ol');
        replies.className = 'comment-replies';
        li.append(replies);
        threads[c.id] = replies;
        addReplyButton(li, c.id);
      }
      list.append(li);
    });
    comments.forEach(function (c) {
      var replies = c.parent_id && threads[c.parent_id];
      if (!replies) return;
      var li = renderComment(c);
      if (c.id) addReplyButton(li, c.parent_id);
      replies.append(li);
    });
    status.textContent = '';
  }

  function load() {
    var query = 'select=id,parent_id,name,body,created_at&order=created_at.asc&post=eq.' + encodeURIComponent(post);
    var comments = fetch(SUPABASE_URL + '/rest/v1/comments?' + query, { headers: headers })
      .then(function (res) {
        if (!res.ok) throw new Error(res.status);
        return res.json();
      });
    return Promise.all([comments, checkPending()])
      .then(function (results) { approved = results[0]; render(); })
      .catch(function () {
        render();
        if (!list.children.length) status.textContent = "couldn't load comments.";
      });
  }

  // Wires up the top-level form, or a reply form cloned from it.
  function setupForm(form, parentId) {
    var msg = form.querySelector('.comment-msg');
    var button = form.querySelector('button');
    var textarea = form.elements.body;

    // Grow the box with its contents instead of showing a resize handle.
    function fit() {
      textarea.style.height = 'auto';
      textarea.style.height = textarea.scrollHeight + 'px';
    }

    function collapse() {
      form.reset();
      if (parentId) { form.remove(); return; }
      form.classList.remove('open');
      fit();
    }

    textarea.addEventListener('focus', function () { form.classList.add('open'); });
    textarea.addEventListener('input', fit);

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var name = form.elements.name.value.trim();
      var body = form.elements.body.value.trim();
      if (!name || !body) { msg.textContent = 'name and comment, please.'; return; }

      // Bots fill the honeypot; act like it worked and send nothing.
      if (form.elements.website.value) { collapse(); return; }

      var token = crypto.randomUUID();
      var comment = { post: post, name: name, body: body, client_token: token };
      if (parentId) comment.parent_id = parentId;
      button.disabled = true;
      msg.textContent = 'posting…';
      fetch(SUPABASE_URL + '/rest/v1/comments', {
        method: 'POST',
        headers: Object.assign({ 'Content-Type': 'application/json', Prefer: 'return=minimal' }, headers),
        body: JSON.stringify(comment)
      })
        .then(function (res) {
          if (!res.ok) throw new Error(res.status);
          writePending(readPending().concat({
            token: token, parent_id: parentId || null, name: name, body: body,
            created_at: new Date().toISOString()
          }));
          collapse();
          msg.textContent = '';
          render();
          setTimeout(load, RELOAD_DELAY_MS);
        })
        .catch(function () { msg.textContent = "couldn't post that — try again?"; })
        .then(function () { button.disabled = false; });
    });
  }

  setupForm(mainForm, null);
  load();
})();
</script>
